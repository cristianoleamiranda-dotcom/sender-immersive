# netlify.toml
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/soluciones"
  to = "/productos"
  status = 301

[[redirects]]
  from = "/en/soluciones"
  to = "/en/productos"
  status = 301

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 200
  conditions = {Language = ["es", "es-*"]}

[[redirects]]
  from = "/en/*"
  to = "/en/:splat"
  status = 200
  conditions = {Language = ["en", "en-*"]}

# SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Form handling (contact form)
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**/*"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
