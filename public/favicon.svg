<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sender">
  <!--
    Marca de Sender: el mástil con su frente de onda.
    Es la misma figura que gobierna la escena 01 —la propagación que nace de un
    mástil— reducida a su mínima expresión. No es un cuadrado con una letra.
    Sólo los colores del sistema: azul profundo de fondo, azul y cian de señal.
  -->
  <rect width="64" height="64" fill="#061424"/>

  <!-- Mástil -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#8CBCE6" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Frentes de onda: tres, con amplitud decreciente -->
  <path d="M21 22 A 13 13 0 0 1 43 22" fill="none" stroke="#1E73BE" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M15 16 A 21 21 0 0 1 49 16" fill="none" stroke="#0085B2" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M9 10 A 29 29 0 0 1 55 10" fill="none" stroke="#0085B2" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Base -->
  <line x1="24" y1="54" x2="40" y2="54" stroke="#494949" stroke-width="2.5"/>
</svg>
