<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#494949" />

    <!--
      El bilingüismo es de URL: ES vive en `/` y EN vive en `/en/`.
      Los marcadores los sustituye el post-compilado (`scripts/seo.mjs` / `scripts/postbuild.mjs`)
      en las 49 shells estáticas y en la raíz.
    -->
    <title>__TITULO__</title>
    <meta name="description" content="__DESCRIPCION__" />
    <link rel="canonical" href="__CANONICA__" />
    <link rel="alternate" hreflang="es-CL" href="__URL_ES__" />
    <link rel="alternate" hreflang="en" href="__URL_EN__" />
    <link rel="alternate" hreflang="x-default" href="__URL_ES__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sender" />
    <meta property="og:url" content="__CANONICA__" />
    <meta property="og:locale" content="__OG_LOCALE__" />
    <meta property="og:locale:alternate" content="__OG_LOCALE_ALT__" />
    <meta property="og:title" content="__TITULO__" />
    <meta property="og:description" content="__DESCRIPCION__" />
    <meta property="og:image" content="__SITIO__/og/__IDIOMA__.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__TITULO__" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <script>
      // Normalización de rutas legadas (/soluciones -> /productos, /en/soluciones -> /en/productos).
      // ES se sirve directamente en `/` y EN en `/en/` (AGENTS.md).
      (function () {
        var BASE = "%BASE_URL%";
        var ruta = window.location.pathname;
        var rel = BASE !== "/" && ruta.indexOf(BASE) === 0 ? "/" + ruta.slice(BASE.length) : ruta;
        rel = rel.replace(/\/+$/, "") || "/";
        if (rel === "/soluciones") {
          window.location.replace(BASE + "productos/" + window.location.search + window.location.hash);
        } else if (rel === "/en/soluciones") {
          window.location.replace(BASE + "en/productos/" + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
