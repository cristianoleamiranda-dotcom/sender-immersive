<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0A" />

    <!--
      El bilingüismo es de URL, no de cliente: /es/ y /en/ son documentos
      distintos. Este archivo raíz sólo decide a cuál mandar.
    -->
    <title>__TITULO__</title>
    <meta name="description" content="__DESCRIPCION__" />
    <!--
      Metadatos de rastreo. Los marcadores los sustituye `scripts/postbuild.mjs`
      por idioma: el HTML que se sirve lleva la canónica correcta ESCRITA, sin
      depender de que el rastreador ejecute JavaScript.
    -->
    <link rel="canonical" href="__CANONICA__" />
    <link rel="alternate" hreflang="es-CL" href="__URL_ES__" />
    <link rel="alternate" hreflang="en" href="__URL_EN__" />
    <link rel="alternate" hreflang="x-default" href="__URL_ES__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sender" />
    <meta property="og:url" content="__CANONICA__" />
    <meta property="og:locale" content="__OG_LOCALE__" />
    <meta property="og:locale:alternate" content="__OG_LOCALE_ALT__" />
    <meta property="og:title" content="__TITULO__" />
    <meta property="og:description" content="__DESCRIPCION__" />
    <meta property="og:image" content="__SITIO__/og/__IDIOMA__.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__TITULO__" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <script>
      // Redirección de raíz: respeta la preferencia del navegador, sin parpadeo.
      // Respeta la BASE para que funcione igual en la raíz de un dominio que
      // bajo un subdirectorio ("/sender-immersive/"). Vite sustituye %BASE_URL%.
      (function () {
        var BASE = "%BASE_URL%";
        var ruta = window.location.pathname;
        var rel = BASE !== "/" && ruta.indexOf(BASE) === 0 ? "/" + ruta.slice(BASE.length) : ruta;
        rel = rel.replace(/\/+$/, "");
        if (rel === "" || rel === "/" || rel === "/index.html") {
          var nav = (navigator.language || "es").toLowerCase();
          var lang = nav.indexOf("es") === 0 ? "es" : nav.indexOf("en") === 0 ? "en" : "es";
          window.location.replace(BASE + lang + "/" + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
